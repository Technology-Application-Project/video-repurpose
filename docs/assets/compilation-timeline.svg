<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" role="img" aria-labelledby="t d">
  <title id="t">Compilation timeline</title>
  <desc id="d">Intro card, selected clips with burned captions, then key takeaway and CTA end card.</desc>
  <rect width="1100" height="280" fill="#f8fafc"/>
  <text x="32" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">compilation.mp4 timeline</text>
  <text x="32" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Captions are burned onto clip segments only. Takeaway and CTA live on the end card, not on each clip.</text>

  <!-- track -->
  <rect x="32" y="88" width="1036" height="88" rx="12" fill="#e2e8f0"/>

  <!-- intro -->
  <rect x="40" y="96" width="120" height="72" rx="8" fill="#1e293b"/>
  <text x="100" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Intro</text>
  <text x="100" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#cbd5e1">12s card</text>

  <!-- clips -->
  <rect x="168" y="96" width="210" height="72" rx="8" fill="#2563eb"/>
  <text x="273" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Clip 1</text>
  <text x="273" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#dbeafe">raw cut + captions</text>

  <rect x="386" y="96" width="210" height="72" rx="8" fill="#1d4ed8"/>
  <text x="491" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Clip 2</text>
  <text x="491" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#dbeafe">raw cut + captions</text>

  <rect x="604" y="96" width="210" height="72" rx="8" fill="#1e40af"/>
  <text x="709" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Clip 35</text>
  <text x="709" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#dbeafe">same treatment</text>

  <!-- end -->
  <rect x="822" y="96" width="236" height="72" rx="8" fill="#059669"/>
  <text x="940" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">End card</text>
  <text x="940" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#d1fae5">takeaway + CTA � 25s</text>

  <!-- caption bar -->
  <rect x="168" y="196" width="646" height="36" rx="8" fill="#0ea5e9"/>
  <text x="491" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">Burned speech captions (Pillow overlay � no ffmpeg drawtext)</text>

  <text x="40" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">work/raw_clips/*.mp4 are temporary. exports/{run_id}/ holds only the compilation bundle.</text>
</svg>
