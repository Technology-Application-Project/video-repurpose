<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d">
  <title id="t">Compilation timeline</title>
  <desc id="d">Intro card with subtitle, selected clips with burned captions, then key takeaway and CTA end card.</desc>
  <rect width="1100" height="300" fill="#f8fafc"/>
  <text x="32" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">compilation.mp4 timeline</text>
  <text x="32" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Captions overlay clip segments only. Takeaway and CTA live on the end card.</text>

  <rect x="32" y="88" width="1036" height="88" rx="12" fill="#e2e8f0"/>

  <rect x="40" y="96" width="140" height="72" rx="8" fill="#1e293b"/>
  <text x="110" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Intro</text>
  <text x="110" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#cbd5e1">title + subtitle</text>
  <text x="110" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#94a3b8">1–2s silent card</text>

  <rect x="188" y="96" width="190" height="72" rx="8" fill="#2563eb"/>
  <text x="283" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Clip 1</text>
  <text x="283" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#dbeafe">letterboxed + captions</text>

  <rect x="386" y="96" width="190" height="72" rx="8" fill="#1d4ed8"/>
  <text x="481" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Clip 2</text>
  <text x="481" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#dbeafe">same canvas</text>

  <rect x="584" y="96" width="210" height="72" rx="8" fill="#1e40af"/>
  <text x="689" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Clips 3–5</text>
  <text x="689" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#dbeafe">same treatment</text>

  <rect x="802" y="96" width="256" height="72" rx="8" fill="#059669"/>
  <text x="930" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">End card</text>
  <text x="930" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#d1fae5">left bullets + small CTA</text>
  <text x="930" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#a7f3d0">2–6s silent card</text>

  <rect x="188" y="200" width="606" height="36" rx="8" fill="#0ea5e9"/>
  <text x="491" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">Burned speech captions (Pillow PNG overlay, batches of 8)</text>

  <text x="40" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">Concat always re-encodes so overlay timestamps stay valid. work/raw_clips/*.mp4 are temporary.</text>
</svg>
