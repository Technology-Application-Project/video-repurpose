<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">POC pipeline architecture</title>
  <desc id="desc">Long video enters WhisperX, Ollama, and MiniLM, then a human keep-gate, then ffmpeg assemble and export.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="460" fill="#f8fafc"/>
  <text x="32" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Educational Short Clip Pipeline</text>
  <text x="32" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Text-first selection  ·  human keep 3–5  ·  one compilation export</text>

  <g filter="url(#shadow)">
    <rect x="32" y="92" width="140" height="64" rx="10" fill="#1e293b"/>
    <text x="102" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">Input</text>
    <text x="102" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#cbd5e1">video + topic</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="204" y="92" width="150" height="64" rx="10" fill="#2563eb"/>
    <text x="279" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">transcribe.py</text>
    <text x="279" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#dbeafe">WhisperX small</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="386" y="92" width="150" height="64" rx="10" fill="#7c3aed"/>
    <text x="461" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">nominate.py</text>
    <text x="461" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#ede9fe">Ollama qwen2.5</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="568" y="92" width="150" height="64" rx="10" fill="#0891b2"/>
    <text x="643" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">rank.py</text>
    <text x="643" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#cffafe">MiniLM cosine</text>
  </g>

  <g filter="url(#shadow)">
    <polygon points="828,124 888,92 948,124 888,156" fill="#d97706"/>
    <text x="888" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">Human</text>
    <text x="888" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#fff7ed">keep 3–5</text>
  </g>

  <line x1="172" y1="124" x2="200" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="354" y1="124" x2="382" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="536" y1="124" x2="564" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="718" y1="124" x2="824" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="204" y="236" width="150" height="64" rx="10" fill="#475569"/>
    <text x="279" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">cut.py</text>
    <text x="279" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#e2e8f0">internal raw only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="386" y="236" width="150" height="64" rx="10" fill="#059669"/>
    <text x="461" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">assemble.py</text>
    <text x="461" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#d1fae5">intro + caps + CTA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="568" y="236" width="150" height="64" rx="10" fill="#dc2626"/>
    <text x="643" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">export.py</text>
    <text x="643" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#fee2e2">compilation.zip</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="32" y="236" width="140" height="64" rx="10" fill="#0f766e"/>
    <text x="102" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">utils.py</text>
    <text x="102" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#ccfbf1">ffmpeg / srt / io</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="236" width="198" height="64" rx="10" fill="#334155"/>
    <text x="849" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">app.py callbacks</text>
    <text x="849" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#cbd5e1">4 tabs + keep-gate</text>
  </g>

  <path d="M888 156 L888 196 L279 196 L279 232" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="354" y1="268" x2="382" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="536" y1="268" x2="564" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="172" y1="268" x2="200" y2="268" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="718" y1="268" x2="746" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="32" y="348" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#334155">Gate: packaging never runs until the human confirms 3–5 on-topic clips.</text>
  <text x="32" y="370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#334155">Output: compilation.mp4, captions.srt, post.txt, selection.json — raw cuts stay in work/</text>
  <text x="32" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#334155">Canvas: Original / 16:9 / 9:16 / 1:1 letterbox. Export rereads live Review start/end (no sentence snap).</text>
  <text x="32" y="422" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">package.py exists but is unused by the current export path (per-clip shorts leftover).</text>
</svg>
