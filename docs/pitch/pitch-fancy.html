<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brevio Studio | 4-minute pitch (cinematic)</title>
<style>
 :root{--ink:#eef5f1;--muted:#9db3a8;--lime:#c5f45d;--gold:#f0c75e;--teal:#4fd1b0;--red:#ff8272;--bg:#07110d;--sans:"Avenir Next","SF Pro Display","Segoe UI",sans-serif;--serif:Palatino,"Palatino Linotype",Georgia,serif}
 *{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
 html,body{height:100%;background:#020504;color:var(--ink);font:16px/1.4 var(--sans);overflow:hidden}
 button{font:inherit;cursor:pointer}
 #app{display:flex;flex-direction:column;height:100%}
 #viewport{flex:1;min-height:0;position:relative;overflow:hidden}
 #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;font-size:34px}
 #bg{position:absolute;inset:0}
 #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,#02060488 100%);pointer-events:none}
 #scenes{position:absolute;inset:0}
 .scene{position:absolute;inset:0;visibility:hidden}
 .scene.active{visibility:visible}
 .scene *{will-change:auto}
 .abs{position:absolute}
 .glass{position:absolute;background:linear-gradient(160deg,#ffffff1c,#ffffff08);border:1.5px solid #ffffff24;border-radius:24px;box-shadow:0 24px 60px #0007,inset 0 1px 0 #ffffff22}
 .lbl{position:absolute;font-size:32px;color:var(--muted);white-space:nowrap}.lbl b{color:var(--ink);font-size:44px;margin-right:10px}
 .h1{position:absolute;font:800 64px/1.08 var(--sans);white-space:nowrap}
 .h1 i,.accent{font-family:var(--serif);font-style:italic;font-weight:700;color:var(--lime)}
 .w{display:inline-block;margin-right:.26em;white-space:pre}
 .kick{position:absolute;font:700 24px var(--sans);text-transform:uppercase;color:var(--lime);letter-spacing:.14em!important}
 .num{font:800 112px/1 var(--sans);color:var(--lime);white-space:nowrap}
 .num.red{color:var(--red)}.num.gold{color:var(--gold)}.num.teal{color:var(--teal)}
 .txt{position:absolute;font-size:30px;line-height:1.3;color:#d7e4dc}
 .small{position:absolute;font-size:22px;line-height:1.3;color:var(--muted)}
 .pill{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;white-space:nowrap;border:2px solid #ffffff30;background:#ffffff14;color:var(--ink)}
 .pill.l{background:#c5f45d22;border-color:#c5f45d88;color:var(--lime)}
 .pill.g{background:#f0c75e22;border-color:#f0c75e99;color:var(--gold)}
 .pill.r{background:#ff827222;border-color:#ff827299;color:var(--red)}
 .bar{position:absolute;border-radius:5px}
 .src{position:absolute;left:110px;right:110px;top:1016px;font-size:18px;line-height:1.3;color:#7f958a}
 .frame{position:absolute;border-radius:16px;background:#0b1511;border:2px solid #ffffff2a;overflow:hidden;box-shadow:0 40px 90px #000a,0 0 80px #c5f45d1a}
 .tb{position:absolute;left:0;right:0;top:0;height:36px;background:#17251f;border-bottom:1px solid #ffffff1f;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:17px;color:var(--muted)}
 .tb i{width:12px;height:12px;border-radius:50%;background:#2e4339}
 .screen{position:absolute;left:0;right:0;top:36px;bottom:0;overflow:hidden}
 .shot,.kb{position:absolute;inset:0}.shot img{display:block;width:100%;height:100%}
 .co{position:absolute;border:4px solid var(--gold);border-radius:8px;box-shadow:0 0 22px #f0c75ecc}
 .co b{position:absolute;left:-4px;top:-38px;background:var(--gold);color:#17251f;font-size:19px;padding:2px 12px;border-radius:7px 7px 7px 0;white-space:nowrap}
 .co.low b{top:auto;bottom:-38px;border-radius:0 7px 7px 7px}.co.lft b{left:auto;right:calc(100% + 4px);top:50%;transform:translateY(-50%);border-radius:7px}
 svg{overflow:visible}

 #stage.open #chip,#stage.open #brand,#stage.open #segs{opacity:0}
 #chip{position:absolute;left:110px;top:44px;display:flex;align-items:center;gap:14px;font:700 22px var(--sans);text-transform:uppercase;letter-spacing:.14em!important;color:var(--ink);z-index:5}
 #chip i{width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px var(--lime)}
 #brand{position:absolute;right:110px;top:44px;font:800 24px var(--sans);letter-spacing:.2em!important;text-transform:uppercase;color:#ffffffaa;z-index:5}
 #clk{position:absolute;right:110px;top:82px;font:600 20px Menlo,monospace;color:#ffffff77;z-index:5;display:none}
 body.showclock #clk{display:block}
 #cap{position:absolute;left:0;right:0;top:902px;text-align:center;font:600 38px/1.3 var(--sans);padding:0 200px;z-index:6;text-shadow:0 2px 18px #000}
 #cap span{color:#ffffff66}#cap span.on{color:#fff}#cap span.cur{color:var(--lime)}
 body.nocap #cap{display:none}
 #segs{position:absolute;left:110px;right:110px;top:1066px;height:6px;z-index:5}
 #segs i{position:absolute;top:0;height:6px;border-radius:3px;background:#ffffff1f;overflow:hidden}#segs i b{display:block;height:100%;width:0;background:var(--lime)}

 /* dock */
 body.clean #dock{display:none}
 #dock{background:#0d1a15;color:#dfe9e4;padding:12px 18px 14px;border-top:1px solid #2b3d35;font-size:15px}
 .pbar{position:relative;height:30px;margin-bottom:22px;background:#22342d;border-radius:4px;cursor:pointer}
 #psegs{position:absolute;inset:0}
 #psegs i{position:absolute;top:0;bottom:0;border-right:2px solid #0d1a15;font:600 11px/30px var(--sans);color:#0f1a16;padding-left:6px;overflow:hidden;white-space:nowrap}
 #band{position:absolute;top:-4px;bottom:-4px;background:#d7ac4033;border-left:2px dashed #d7ac40;border-right:2px dashed #d7ac40;pointer-events:none}
 #tgt{position:absolute;top:-6px;bottom:-6px;width:3px;background:#fff;pointer-events:none}
 .tl{position:absolute;top:32px;font-size:11px;color:#9fb5aa;transform:translateX(-50%)}
 #head{position:absolute;top:-8px;bottom:-8px;width:4px;background:#d7f35d;pointer-events:none;border-radius:2px}
 .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 .row button{background:#22342d;color:#dfe9e4;border:1px solid #38503f;border-radius:6px;padding:6px 14px}
 .row button:hover{background:#2d443a}.row button.on{background:#d7f35d;color:#16231e;border-color:#d7f35d;font-weight:700}
 .row label{display:flex;gap:6px;align-items:center;cursor:pointer}
 #clock{font:600 17px Menlo,monospace;margin-left:auto}
 #status{border-radius:999px;padding:4px 14px;background:#22342d;font-weight:600}
 #status.ok{background:#1f5a3f;color:#c9f5d9}#status.bad{background:#6b2f2a;color:#ffd9d4}
 #prompter{margin-top:12px;display:none;border-top:1px solid #2b3d35;padding-top:10px}
 body.pres #prompter{display:block}
 #pmeta{font-size:13px;color:#9fb5aa;text-transform:uppercase;font-weight:700}
 #ptext{font-size:24px;line-height:1.45;max-height:150px;overflow:auto;margin-top:4px}
 #ptext span{opacity:.4}#ptext span.cur{opacity:1;background:#d7f35d;color:#16231e;border-radius:4px;padding:0 4px}#ptext span.past{opacity:.25}
 #help{position:fixed;right:16px;bottom:16px;max-width:380px;background:#16231ef0;color:#dfe9e4;border:1px solid #38503f;border-radius:8px;padding:14px 18px;font-size:14px;line-height:1.6;display:none;z-index:20}
 #help.on{display:block}#help kbd{background:#2d443a;border-radius:4px;padding:1px 6px;font-family:Menlo,monospace}
 #audionote{color:#ffd9d4;font-size:13px}
</style>
</head>
<body>
<div id="app">
 <div id="viewport">
  <div id="stage">
   <canvas id="bg" width="1920" height="1080"></canvas>
   <div id="scenes"></div>
   <div id="vig"></div>
   <div id="chip"><i></i><span id="chipt"></span></div>
   <div id="brand">Brevio Studio</div>
   <div id="clk">0:00</div>
   <div id="cap"></div>
   <div id="segs"></div>
  </div>
 </div>
 <div id="dock">
  <div class="pbar" id="pbar" title="Click to seek"><div id="band"></div><div id="psegs"></div><div id="tgt"></div><div id="head"></div></div>
  <div class="row">
   <button id="bPlay">Play</button><button id="bRestart">Restart</button><button id="bPrev">&#9664; Scene</button><button id="bNext">Scene &#9654;</button>
   <span style="width:10px"></span>
   <button id="mAuto">Auto (voice-over)</button><button id="mPres">Presenter (live)</button>
   <label><input type="checkbox" id="cCap" checked> Captions</label>
   <label><input type="checkbox" id="cClock"> Stage clock</label>
   <button id="bFull">Fullscreen</button><button id="bClean">Clean view (H)</button><button id="bHelp">Keys (?)</button>
   <span id="audionote"></span><span id="status">Ready</span><span id="clock">0:00 / 0:00</span>
  </div>
  <div id="prompter"><div id="pmeta"></div><p id="ptext"></p></div>
 </div>
</div>
<div id="help"><b>Keys</b><br><kbd>Space</kbd> play / pause &nbsp; <kbd>R</kbd> restart<br><kbd>&larr;</kbd><kbd>&rarr;</kbd> previous / next scene &nbsp; <kbd>1</kbd>&ndash;<kbd>8</kbd> jump<br><kbd>M</kbd> auto / presenter &nbsp; <kbd>C</kbd> captions &nbsp; <kbd>T</kbd> stage clock<br><kbd>H</kbd> clean view &nbsp; <kbd>F</kbd> fullscreen<br>URL: <code>?mode=presenter&amp;clean=1&amp;t=90</code></div>
<audio id="vo" src="voice-over.wav" preload="auto"></audio>
<script src="timings.js"></script>
<script>
(function(){
'use strict';
const TIM = window.PITCH_TIMINGS;
if(!TIM){document.body.textContent='timings.js is missing. Run tools/make_voiceover.py then tools/make_pitch_assets.py.';return;}
const OPEN = new URLSearchParams(location.search).get('opening')==='0' ? 0 : 6, CREDITS = 9, OFF = OPEN, AUDIO_END = TIM.total + OFF; // the voice-over starts after the opening; the credits follow it
const shifted = TIM.scenes.map(sc => ({...sc, start:sc.start+OFF, end:sc.end+OFF, sentences:sc.sentences.map(x => ({...x, start:x.start+OFF, end:x.end+OFF}))}));
const scenes = [...(OPEN ? [{id:'opening', label:'Opening', start:0, end:OPEN, sentences:[]}] : []), ...shifted, {id:'credits', label:'Team', start:AUDIO_END, end:AUDIO_END+CREDITS, sentences:[]}], TOTAL = AUDIO_END+CREDITS, TARGET = 240, LO = 210, HI = 270, W = 1920, H = 1080;
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const lerp = (a,b,p) => a+(b-a)*p;
const fmt = s => { s = Math.max(0,s); return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); };
const hex = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixc = (a,b,p) => { const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')})`; };
const EASE = {lin:p=>p, out:p=>1-Math.pow(1-p,3), inout:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, back:p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);}, expo:p=>p>=1?1:1-Math.pow(2,-10*p)};
const stage = $('#stage'), vo = $('#vo'), params = new URLSearchParams(location.search);
const S = {t:0, playing:false, mode:params.get('mode')==='presenter'?'presenter':'auto', wall:0, last:performance.now(), audioOK:false, audioFailed:false, waiting:false, cur:-1, done:false, sent:-2};

/* ---------- tween engine: every visual is a pure function of the clock ---------- */
const DEF = {o:1,x:0,y:0,s:1,r:0,b:0,sy:1};
function E(parent, cls, html, css){ const e=document.createElement('div'); e.className=cls||''; if(html) e.innerHTML=html; if(css) Object.assign(e.style,css); parent.appendChild(e); return e; }
function reg(sc, el, at, dur, from, to, ease){ let r=sc.els.get(el); if(!r){r={tws:[],init:null};sc.els.set(el,r);} r.tws.push({at,dur,from,to,ease:EASE[ease||'out']}); }
const show = (sc,el,at,o={}) => reg(sc,el,at,o.dur??.7,{o:0,y:o.y??36,x:o.x??0,s:o.s??1,b:o.b??0},{o:1,y:0,x:0,s:1,b:0},o.ease);
const hide = (sc,el,at,o={}) => reg(sc,el,at,o.dur??.5,{o:1,y:0,x:0,s:1,b:0},{o:0,y:o.y??-20,x:o.x??0,s:o.s??1,b:o.b??0},o.ease);
const fn = (sc,at,dur,f,ease) => sc.fns.push({at,dur,f,ease:EASE[ease||'out']});
function finalize(sc){
  for(const r of sc.els.values()){
    r.tws.sort((a,b)=>a.at-b.at);
    r.init = {...DEF}; const seen = new Set();
    for(const tw of r.tws) for(const k in tw.from) if(!seen.has(k)){ r.init[k]=tw.from[k]; seen.add(k); }
  }
}
function paint(el, st){
  const key = st.o.toFixed(3)+'|'+st.x.toFixed(1)+'|'+st.y.toFixed(1)+'|'+st.s.toFixed(3)+'|'+st.r.toFixed(2)+'|'+st.b.toFixed(1)+'|'+st.sy.toFixed(3);
  if(el.__k===key) return; el.__k = key;
  el.style.opacity = st.o;
  el.style.transform = `translate(${st.x}px,${st.y}px) rotate(${st.r}deg) scale(${st.s}) scale(1,${st.sy})`;
  el.style.filter = st.b>0.05 ? `blur(${st.b}px)` : 'none';
}
function evalScene(sc, lt){
  for(const [el,r] of sc.els){
    const st = {...r.init};
    for(const tw of r.tws){
      if(lt<tw.at) break;
      const p = tw.ease(clamp((lt-tw.at)/tw.dur,0,1));
      for(const k in tw.to) st[k] = tw.from[k]+(tw.to[k]-tw.from[k])*p;
    }
    paint(el, st);
  }
  for(const f of sc.fns){ const p = clamp((lt-f.at)/f.dur,0,1); f.f(f.ease(p), lt, p); }
}
const counter = (sc,el,at,dur,to,o={}) => fn(sc,at,dur,p=>{ el.textContent=(o.pre||'')+(to*p).toLocaleString('en-US',{minimumFractionDigits:o.dec||0,maximumFractionDigits:o.dec||0})+(o.suf||''); });
function words(sc, parent, text, at, o={}){
  const holder = E(parent,'abs',''); 
  const spans = text.split(' ').map((t,i)=>{ const w=E(holder,'w',t); show(sc,w,at+i*(o.step??.09),{y:o.y??40,b:o.b??10,dur:o.dur??.7}); return w; });
  return {holder, spans};
}
function ring(parent, x, y, size, color, w){
  const r=(size-w)/2, c=2*Math.PI*r;
  const wrap=E(parent,'abs','',{left:x+'px',top:y+'px',width:size+'px',height:size+'px'});
  wrap.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#ffffff22" stroke-width="${w}"/><circle class="rg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" style="filter:drop-shadow(0 0 10px ${color})"/></svg>`;
  const c1 = wrap.querySelector('.rg');
  return {wrap, set:p=>{c1.style.strokeDashoffset=c*(1-p);}};
}
const ICON = {
  cap:'<path d="M4 22 32 8l28 14-28 14L4 22Zm12 10v10c0 5 8 8 16 8s16-3 16-8V32" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>',
  brief:'<rect x="6" y="18" width="52" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><path d="M22 18v-6h20v6M6 32h52" fill="none" stroke="currentColor" stroke-width="4"/>',
  flask:'<path d="M26 6h12M28 6v18L10 52a4 4 0 0 0 4 6h36a4 4 0 0 0 4-6L36 24V6" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>',
  bolt:'<path d="M36 4 12 36h18l-4 24 26-34H34L36 4Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>',
  shield:'<path d="M32 4 8 14v18c0 14 10 24 24 28 14-4 24-14 24-28V14L32 4Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="m22 32 8 8 14-16" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>',
  user:'<circle cx="32" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="4"/><path d="M8 58c2-16 14-22 24-22s22 6 24 22" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
  lock:'<rect x="10" y="28" width="44" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><path d="M20 28V20a12 12 0 0 1 24 0v8" fill="none" stroke="currentColor" stroke-width="4"/>',
  laptop:'<rect x="10" y="12" width="44" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="4"/><path d="M2 52h60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
  cloud:'<path d="M18 50a12 12 0 0 1-2-24 16 16 0 0 1 31-3 11 11 0 0 1 1 27H18Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>',
  clock:'<circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="4"/><path d="M32 16v16l10 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
  warn:'<path d="M32 6 4 56h56L32 6Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M32 24v16M32 47v2" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>'
};
const icon = (parent, name, x, y, size, color) => E(parent,'abs',`<svg width="${size}" height="${size}" viewBox="0 0 64 64" style="color:${color}">${ICON[name]}</svg>`,{left:x+'px',top:y+'px'});

/* ---------- scenes ---------- */
const BUILD = {};
const SRC = (root,text) => E(root,'src',text);

BUILD.hook = (sc,root,s) => {
  const g = E(root,'abs','',{inset:'0'});
  const lab = E(g,'lbl','<b>30:00</b> one lecture, 1,800 seconds',{left:'160px',top:'200px'}); show(sc,lab,.3);
  const N=72, x0=160, wid=1600, bw=14, gap=(wid-N*bw)/(N-1), sel=new Set([11,12,13,14,15,33,34,35,36,37,38,39,40,58,59,60,61,62]);
  const bars=[];
  for(let k=0;k<N;k++){
    const hgt = 70+((k*37+(k%5)*19)%100)*1.5;
    const b=E(g,'bar','',{left:(x0+k*(bw+gap))+'px',top:(480-hgt)+'px',width:bw+'px',height:hgt+'px',background:'#6c8a7d',transformOrigin:'50% 100%'});
    reg(sc,b,.3+k*.025,.7,{o:0,sy:0},{o:1,sy:1},'out');
    bars.push({b,k,hgt});
    if(sel.has(k)){
      const idx=[...sel].indexOf(k);
      fn(sc,s(1),.9,p=>{ b.style.background=mixc('#6c8a7d','#f0c75e',p); b.style.boxShadow=p>.05?`0 0 ${20*p}px #f0c75ecc`:'none'; });
      reg(sc,b,s(1)+2.3+idx*.03,1.1,{y:0,s:1,o:1},{y:300,s:.5,o:0},'inout');
    } else {
      reg(sc,b,s(1),.9,{o:1},{o:.12},'out');
    }
  }
  const l2 = E(g,'lbl','<b>about 0:40</b> one short video for the audience you choose',{left:'160px',top:'560px'}); show(sc,l2,s(1)+2.2);
  const parts=[['Opening',1,0],['Clip',2.4,1],['Bridge',.9,0],['Clip',2.4,1],['Bridge',.9,0],['Clip',2.4,1],['Ending',1,0]];
  const unit=(1600-12*6)/parts.reduce((a,p)=>a+p[1],0); let x=160;
  parts.forEach((p,i)=>{
    const c=E(g,'pill '+(p[2]?'':'l'),p[0],{left:x+'px',top:'620px',width:(p[1]*unit)+'px',height:'110px',borderRadius:'18px',fontSize:'30px',background:p[2]?'#7aa8c022':'#c5f45d22',borderColor:p[2]?'#7aa8c099':'#c5f45d88',color:p[2]?'#a9d3ea':'var(--lime)'});
    show(sc,c,s(1)+2.8+i*.28,{y:30,s:.8,ease:'back',dur:.6}); x+=p[1]*unit+12;
  });
  const bd = E(g,'pill g','<svg width="34" height="34" viewBox="0 0 64 64" style="margin-right:10px;color:var(--gold)">'+ICON.shield+'</svg>Approved by a person',{left:'1230px',top:'760px',width:'440px',height:'64px',fontSize:'28px'}); show(sc,bd,s(1)+5.4,{s:.8,ease:'back'});
  reg(sc,g,s(2),.9,{o:1,s:1,b:0},{o:.16,s:.96,b:6},'out');
  const t = E(root,'abs','',{left:'0',right:'0',top:'330px',textAlign:'center'});
  'Brevio Studio'.split('').forEach((ch,i)=>{ const sp=E(t,'abs',ch===' '?'&nbsp;':ch,{position:'relative',display:'inline-block',font:'800 190px/1.1 var(--sans)',color:'var(--lime)',textShadow:'0 0 60px #c5f45d66'}); show(sc,sp,s(2)+i*.05,{y:80,b:14,dur:.8,ease:'out'}); });

/* ---------- background ---------- */
const bg = $('#bg').getContext('2d');
const P = Array.from({length:110},(_,i)=>{ const r=(n)=>{const x=Math.sin(i*12.9898+n*78.233)*43758.5453;return x-Math.floor(x);}; return {x:r(1)*W,y:r(2)*H,v:6+r(3)*22,ph:r(4)*6.28,r:.8+r(5)*2.4,a:.18+r(6)*.45}; });
function palette(t){
  const i=sceneAt(t), cur=PAL[scenes[i].id], k=clamp((t-scenes[i].start)/1.2,0,1);
  if(i===0||k>=1) return cur; const prev=PAL[scenes[i-1].id]; return cur.map((c,n)=>mixc(prev[n],c,EASE.out(k)));
}
function drawBg(t){
  bg.globalCompositeOperation='source-over'; bg.fillStyle='#050d0a'; bg.fillRect(0,0,W,H);
  const pal=palette(t); bg.globalCompositeOperation='lighter';
  [[.5+.28*Math.sin(t*.11),.35+.2*Math.cos(t*.09),820,0],[.25+.22*Math.cos(t*.07+1),.7+.18*Math.sin(t*.13),700,1],[.8+.15*Math.sin(t*.1+2),.65+.2*Math.cos(t*.08+3),640,2]].forEach(([fx,fy,r,ci])=>{
    const x=fx*W,y=fy*H,g=bg.createRadialGradient(x,y,0,x,y,r); const col=pal[ci];
    const rgb=col.startsWith('rgb')?col.slice(4,-1):hex(col).join(','); g.addColorStop(0,`rgba(${rgb},.42)`); g.addColorStop(1,`rgba(${rgb},0)`); bg.fillStyle=g; bg.fillRect(0,0,W,H); });
  bg.globalCompositeOperation='source-over';
  bg.strokeStyle='rgba(255,255,255,.035)'; bg.lineWidth=1; bg.beginPath();
  for(let x=0;x<=W;x+=120){bg.moveTo(x+.5,0);bg.lineTo(x+.5,H);} for(let y=0;y<=H;y+=120){bg.moveTo(0,y+.5);bg.lineTo(W,y+.5);} bg.stroke();
  P.forEach(p=>{ const x=(p.x+t*p.v)%W, y=p.y+Math.sin(t*.5+p.ph)*26, a=p.a*(.55+.45*Math.sin(t*1.3+p.ph)); bg.fillStyle=`rgba(220,255,200,${a})`; bg.beginPath(); bg.arc(x,y,p.r,0,6.283); bg.fill(); });
}

/* ---------- captions (karaoke) ---------- */
let capKey='', capWords=[];
// Stateless: the caption depends only on the clock, never on which frame was drawn before.
function captionIndex(sc, t){
  let idx=-1; sc.sentences.forEach((x,k)=>{ if(t>=x.start-.02) idx=k; });
  return idx>=0&&t<sc.sentences[idx].end+.35 ? idx : -1;
}
function drawCaption(sc, t){
  const cap=$('#cap'), si=captionIndex(sc,t);
  if(si<0){ if(capKey||cap.firstChild){cap.textContent='';capWords=[];capKey='';} return; }
  const sen=sc.sentences[si], key=sc.id+':'+si;
  if(key!==capKey){ cap.textContent=''; capWords=[]; const ws=sen.text.split(' '), tot=sen.text.length; let acc=0;
    ws.forEach(w=>{ const sp=document.createElement('span'); sp.textContent=w+' '; cap.appendChild(sp); capWords.push({sp,at:acc/tot}); acc+=w.length+1; }); capKey=key; }
  const f=clamp((t-sen.start)/(sen.end-sen.start),0,1);
  let cur=-1; capWords.forEach((w,i)=>{ if(f>=w.at-.01) cur=i; });
  capWords.forEach((w,i)=>{ const c=i<cur?'on':i===cur?'cur':''; if(w.sp.className!==c) w.sp.className=c; });
}

/* ---------- main render ---------- */
function sceneAt(t){for(let i=scenes.length-1;i>=0;i--) if(t>=scenes[i].start) return i; return 0;}
function setStageScale(){ const v=$('#viewport'), k=Math.min(v.clientWidth/W, v.clientHeight/H); stage.style.transform=`translate(${-W/2*k}px,${-H/2*k}px) scale(${k})`; }
function buildPrompter(i){ const sc=scenes[i], p=$('#ptext'); p.textContent=''; sc.sentences.forEach(s=>{const e=document.createElement('span');e.textContent=s.text+' ';p.appendChild(e);}); }
const segsBox=$('#segs'), segEls=scenes.map((sc,i)=>{ const e=document.createElement('i'); e.style.left=(sc.start/TOTAL*1700)+'px'; e.style.width=((sc.end-sc.start)/TOTAL*1700-6)+'px'; e.innerHTML='<b></b>'; segsBox.appendChild(e); return e; });
function render(){
  const i=sceneAt(Math.min(S.t,TOTAL-.001)), sc=SC[i], lt=S.t-scenes[i].start;
  if(i!==S.cur){ if(S.cur>=0) SC[S.cur].root.classList.remove('active'); sc.root.classList.add('active'); S.cur=i; S.sent=-2; $('#chipt').textContent=scenes[i].id==='opening'?'':String(i+(OPEN?0:1)).padStart(2,'0')+'  '+scenes[i].label; stage.classList.toggle('open',scenes[i].id==='opening'); buildPrompter(i); }
  evalScene(sc,lt);
  const fade=Math.min(clamp(lt/.5,0,1), clamp((scenes[i].end-S.t)/.5,0,1)); sc.root.style.opacity=i===0?clamp((scenes[i].end-S.t)/.5,0,1):fade;
  drawBg(S.t); drawCaption(scenes[i],S.t);
  segEls.forEach((e,n)=>{ e.firstChild.style.width=(clamp((S.t-scenes[n].start)/(scenes[n].end-scenes[n].start),0,1)*100)+'%'; });
  hud(scenes[i]);
}
function hud(sc){
  const proj=S.wall+(TOTAL-S.t), drift=S.wall-S.t;
  $('#clock').textContent=`${fmt(S.t)} / ${fmt(TOTAL)}`; $('#head').style.left=(S.t/HI*100)+'%'; $('#clk').textContent=fmt(S.t);
  const st=$('#status'), len=S.done?S.wall:proj, ok=len>=LO&&len<=HI; st.className=ok?'ok':'bad';
  st.textContent=S.done?`Finished in ${fmt(S.wall)}: ${ok?'within':'outside'} 4:00 \u00b1 0:30`:`Projected ${fmt(proj)} \u00b7 ${S.mode==='presenter'?(drift>=0?'+':'')+drift.toFixed(1)+' s vs plan':'on plan'}`;
  const k=sc.sentences.findIndex(x=>S.t>=x.start-.05&&S.t<x.end+.3);
  if(k!==S.sent){ S.sent=k; [...$('#ptext').children].forEach((e,n)=>{e.className=n===k?'cur':(k>=0&&n<k?'past':'');}); }
  if(S.mode==='presenter') $('#pmeta').textContent=`Scene ${S.cur+1} of ${scenes.length} \u00b7 ${sc.label} \u00b7 ${fmt(sc.end-S.t)} left in scene`;
}

/* ---------- transport (same behaviour as the light version) ---------- */
(function(){ const colors=['#9ec5b5','#b8cec3','#d7ac40','#9bb4c2','#c8d8a0','#e0a8a0','#d9a8a3','#d7f35d'], box=$('#psegs');
  scenes.forEach((sc,i)=>{const e=document.createElement('i');e.style.left=(sc.start/HI*100)+'%';e.style.width=((sc.end-sc.start)/HI*100)+'%';e.style.background=colors[i%8];e.textContent=sc.label;box.appendChild(e);});
  $('#band').style.left=(LO/HI*100)+'%'; $('#band').style.width=((HI-LO)/HI*100)+'%'; $('#tgt').style.left=(TARGET/HI*100)+'%';
  [[LO,'3:30'],[TARGET,'4:00'],[HI,'4:30']].forEach(([v,l])=>{const e=document.createElement('span');e.className='tl';e.style.left=(v/HI*100)+'%';e.textContent=l;$('#pbar').appendChild(e);}); })();
function syncAudio(){ // the voice-over plays only between the opening and the credits
  if(!(S.playing&&S.mode==='auto'&&S.audioOK)) return;
  const inVoice=S.t>=OFF&&S.t<AUDIO_END-.05;
  if(inVoice&&vo.paused&&!vo.ended){ try{vo.currentTime=S.t-OFF;}catch(e){} vo.play().catch(()=>{S.audioOK=false;$('#audionote').textContent='Audio blocked: running silent timer';}); }
  else if(!inVoice&&!vo.paused) vo.pause();
}
function tick(now){ const dt=Math.min((now-S.last)/1000,.25); S.last=now;
  if(S.playing){ S.wall+=dt; syncAudio();
    if(S.mode==='auto'&&S.audioOK&&!vo.paused){ const a=vo.currentTime+OFF; S.t=(a>=S.t-.25&&a<=S.t+.5)?Math.max(S.t,a):a; } // never step backwards on audio-clock jitter
    else S.t+=dt;
    if(S.t>=TOTAL-.02){S.t=TOTAL-.02;finish();} }
  render(); requestAnimationFrame(tick); }
function seek(t){ S.t=clamp(t,0,TOTAL-.02); S.done=false; try{vo.currentTime=Math.max(0,S.t-OFF);}catch(e){} render(); }
function play(){ if(S.t>=TOTAL-.05) restart(false);
  if(S.mode==='auto'&&!S.audioOK&&!S.audioFailed){S.waiting=true;$('#audionote').textContent='Loading voice-over...';return;}
  S.waiting=false;S.done=false;S.playing=true;S.last=performance.now(); syncAudio();
  $('#bPlay').textContent='Pause';$('#bPlay').classList.add('on'); }
function pause(){S.playing=false;S.waiting=false;vo.pause();$('#bPlay').textContent='Play';$('#bPlay').classList.remove('on');}
function finish(){pause();S.done=true;$('#bPlay').textContent='Replay';}
function restart(go){S.wall=0;S.done=false;seek(0);if(go)play();}
function toggle(){S.playing?pause():play();}
function gotoScene(i){seek(scenes[clamp(i,0,scenes.length-1)].start+.01);}
function setMode(m){pause();S.mode=m;document.body.classList.toggle('pres',m==='presenter');$('#mAuto').classList.toggle('on',m==='auto');$('#mPres').classList.toggle('on',m==='presenter');S.wall=S.t;S.done=false;}
vo.addEventListener('canplaythrough',()=>{S.audioOK=true;$('#audionote').textContent='';if(S.waiting)play();});
vo.addEventListener('error',()=>{S.audioOK=false;S.audioFailed=true;$('#audionote').textContent='voice-over.wav not found: silent timer';if(S.waiting)play();});
vo.addEventListener('ended',()=>{}); // the clock keeps running through the credits
if(vo.readyState>=4)S.audioOK=true;
$('#bPlay').onclick=e=>{toggle();e.target.blur();};$('#bRestart').onclick=e=>{restart(false);e.target.blur();};
$('#bPrev').onclick=e=>{gotoScene(S.cur-(S.t-scenes[S.cur].start>2?0:1));e.target.blur();};$('#bNext').onclick=e=>{gotoScene(S.cur+1);e.target.blur();};
$('#mAuto').onclick=e=>{setMode('auto');e.target.blur();};$('#mPres').onclick=e=>{setMode('presenter');e.target.blur();};
$('#cCap').onchange=e=>document.body.classList.toggle('nocap',!e.target.checked);$('#cClock').onchange=e=>document.body.classList.toggle('showclock',e.target.checked);
$('#bFull').onclick=e=>{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{});e.target.blur();};
$('#bClean').onclick=()=>document.body.classList.add('clean');$('#bHelp').onclick=()=>$('#help').classList.toggle('on');
$('#pbar').addEventListener('click',e=>{const r=$('#pbar').getBoundingClientRect();seek((e.clientX-r.left)/r.width*HI);});
window.addEventListener('resize',setStageScale);
window.addEventListener('keydown',e=>{ if(e.metaKey||e.ctrlKey||e.altKey)return; const k=e.key;
  if(k===' '){e.preventDefault();toggle();} else if(k==='ArrowRight')gotoScene(S.cur+1); else if(k==='ArrowLeft')gotoScene(S.cur-(S.t-scenes[S.cur].start>2?0:1));
  else if(k==='r'||k==='R')restart(false); else if(k==='m'||k==='M')setMode(S.mode==='auto'?'presenter':'auto');
  else if(k==='c'||k==='C'){const b=$('#cCap');b.checked=!b.checked;b.onchange({target:b});} else if(k==='t'||k==='T'){const b=$('#cClock');b.checked=!b.checked;b.onchange({target:b});}
  else if(k==='h'||k==='H')document.body.classList.toggle('clean'); else if(k==='f'||k==='F')$('#bFull').click(); else if(k==='?')$('#help').classList.toggle('on'); else if(/^[0-9]$/.test(k))gotoScene(+k-(OPEN?0:1)); });

setMode(S.mode);
if(params.get('clean')==='1')document.body.classList.add('clean');
if(params.get('captions')==='0'){$('#cCap').checked=false;document.body.classList.add('nocap');}
if(params.get('t')){seek(parseFloat(params.get('t'))||0);S.wall=S.t;}
setStageScale(); render(); requestAnimationFrame(tick);
if(params.get('autoplay')==='1')play();
window.__renderFrame=t=>{ S.t=clamp(t,0,TOTAL-.001); render(); };
window.__ready=Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
window.__pitch={S,seek,play,pause,scenes,TOTAL,OFF};
})();
</script>
